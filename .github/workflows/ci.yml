name: CI

on:
  pull_request:
  push:
    branches: [main, runtime-hardening-asr-llm-tts, speech-acceptance-summary]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run smoke:mcp
      - run: npm run eval:speech-real
      - run: npm run benchmark:speech-summary
      - run: npm run smoke:speech-mcp
      - run: npm --prefix apps/mobile ci
      - run: npm run audit:mobile
      - run: npm run typecheck:mobile

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - run: npm --prefix apps/mobile ci
      - name: Install Android SDK 37 and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
      - name: Generate React Native Android codegen
        run: npm --prefix apps/mobile run codegen:android
      - name: Compile Android native host
        run: npm --prefix apps/mobile run build:android
