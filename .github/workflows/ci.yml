name: CI

on:
  pull_request:
  push:
    branches: [main, runtime-hardening-asr-llm-tts, speech-acceptance-summary]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - run: npm run smoke:mcp
      - run: npm run eval:speech-real
      - run: npm run benchmark:speech-summary
      - run: npm run smoke:speech-mcp
      - run: npm --prefix apps/mobile ci
      - run: npm run audit:mobile
      - run: npm run typecheck:mobile

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - run: npm --prefix apps/mobile ci
      - name: Install stable Android SDK 36 and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
      # assembleDebug runs the React Native Codegen tasks as dependencies. Keep
      # codegen:android as a local diagnostic command instead of paying for a
      # second Gradle/plugin startup on every CI run.
      - name: Compile Android native host
        run: npm --prefix apps/mobile run build:android

  ios-native:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm --prefix apps/mobile ci
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Install React Native iOS pods and generate Codegen
        run: npm --prefix apps/mobile run pods:ios
      - name: Compile iOS native host
        run: npm --prefix apps/mobile run build:ios
